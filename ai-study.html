<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra — RISE AI</title>
    <meta name="description" content="Your intelligent study companion by RISE.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="ai-study.css">
</head>
<body>
<div class="ai-app">

    <div class="ai-sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="ai-sidebar" id="sidebar">
        <div class="ai-sidebar-top">
            <div class="ai-sidebar-brand">
                <div class="sidebar-brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div>
                    <div class="sidebar-brand-name">Astra</div>
                    <div class="sidebar-brand-sub">by RISE</div>
                </div>
            </div>
            <button class="ai-new-chat-btn" id="newChatBtn" title="New chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </button>
            <button class="ai-sidebar-toggle" id="closeSidebarBtn" title="Close sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
        </div>

        <div class="ai-history-list" id="historyList"></div>

        <div class="ai-sidebar-bottom">
            <a href="study.html" class="ai-back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to Dashboard
            </a>
            <div class="ai-user-profile">
                <div class="user-avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <span class="user-name">Student</span>
            </div>
        </div>
    </aside>

    <main class="ai-main">
        <header class="ai-header">
            <button class="ai-sidebar-open-btn" id="openSidebarBtn" title="Open sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg>
            </button>
            <div class="ai-model-label">
                <div class="astra-header-brand">
                    <div class="astra-header-dot"></div>
                    <span class="astra-header-name">Astra</span>
                </div>
                <span class="astra-header-tag">Study Buddy</span>
            </div>
            <div class="ai-header-actions">
                <button class="header-btn" id="exportChatBtn" title="Export Chat as Markdown">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
            </div>
        </header>

        <div class="ai-chat-window" id="chatWindow">
            <div class="ai-welcome-container" id="welcomeMessage">
                <div class="ai-welcome-logo">
                    <svg class="doodle-sparkle" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z" stroke-linejoin="round"/></svg>
                    <svg class="doodle-sparkle-2" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z" stroke-linejoin="round"/></svg>
                    <div class="astra-logo-icon">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    </div>
                </div>
                <h1>Hello, I&#39;m <span>Astra</span></h1>
                <p class="ai-welcome-tagline">Let's sketch out some brilliant ideas today!</p>
                <div class="ai-suggestions-grid">
                    <button class="ai-suggest-card" data-prompt="Explain Data Structures like I'm 5 years old">
                        <div class="card-icon">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">Data Structures</span>
                            <span class="card-desc">Explain like I'm 5</span>
                        </div>
                    </button>
                    <button class="ai-suggest-card" data-prompt="Help me debug this C programming code">
                        <div class="card-icon">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M17.47 9c1.93-.2 3.53-1.9 3.53-4"/><path d="M3 15h2"/><path d="M19 15h2"/><path d="M4 19.5c2.1 1.7 5.2 2.5 8 2.5s5.9-.8 8-2.5"/></svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">Debug C Code</span>
                            <span class="card-desc">Find the bug for me</span>
                        </div>
                    </button>
                    <button class="ai-suggest-card" data-prompt="Quiz me on Mathematics concepts">
                        <div class="card-icon">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">Math Quiz</span>
                            <span class="card-desc">Test my knowledge</span>
                        </div>
                    </button>
                    <button class="ai-suggest-card" data-prompt="Summarize the concept of linked lists with examples">
                        <div class="card-icon">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">Linked Lists</span>
                            <span class="card-desc">Summarize with examples</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <div class="ai-input-container">
            <div class="ai-input-box" id="inputBox">
                <textarea id="chatInput" placeholder="Message Astra..." rows="1"></textarea>
                <div class="ai-input-actions">
                    <button class="ai-send-btn" id="sendBtn" title="Send message" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </div>
            </div>
            <p class="ai-input-footer">Astra can make mistakes. Consider verifying important information.</p>
        </div>
    </main>
</div>

<!-- Highlight.js for code blocks -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<script src="ai-study.js"></script>
</body>
</html>
